services:
  # Backend Web Service (FREE)
  - type: web
    name: portfolio-backend
    runtime: python
    region: singapore  # Change to your preferred region
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false  # Set manually in Render dashboard
      - key: ADMIN_PASSWORD
        sync: false  # Set manually in Render dashboard
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false  # Set manually
      - key: SMTP_PASSWORD
        sync: false  # Set manually
      - key: CORS_ORIGINS
        value: '["http://localhost:5173","http://localhost:3000"]'
      - key: DATA_DIR
        value: /data
    disk:
      name: portfolio-uploads
      mountPath: /data
      sizeGB: 1

databases:
  # PostgreSQL Database (FREE)
  - name: portfolio-db
    databaseName: portfolio
    region: singapore  # Same as web service
    plan: free
    ipAllowList: []  # Allow all IPs for free tier
